name: "Bazel Actions"
description: "Run several targets and output their result in checks"
inputs:
  tag:
    description: "Tag to use to collect target: bazel query attr(tags, \\${tag}\\b, //...)"
    required: false
  query:
    description: "Targets to include"
    required: false
  excludes:
    description: "Targets to excludes (NOT IMPLEMENTED)"
    required: false
  ignoreSuccessOutput:
    description: "Do not display output on success"
    default: "true"
    required: false
  bazel:
    description: "Build tool to run: bazel, or a compatible one such as blast"
    default: "bazel"
    required: false
  build:
    description: "Build every target in one command before running them one by one"
    default: "true"
    required: false
  checkName:
    description: "Name to use for check"
    default: "bazel-run"
    required: false
runs:
  using: "node20"
  main: "dist/main/index.mjs"
